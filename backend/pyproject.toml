[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "urcv-backend"
version = "1.0.0"
description = "Universal Resume Conversion & Verification - Backend API"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "URCV Team"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "fastapi==0.108.0",
    "uvicorn[standard]==0.25.0",
    "python-multipart==0.0.6",
    
    # Database
    "sqlalchemy==2.0.25",
    "alembic==1.13.0",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    
    # Validation
    "pydantic==2.5.3",
    "pydantic-settings==2.1.0",
    "email-validator==2.1.0",
    
    # Authentication
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    
    # PDF Processing
    "PyMuPDF==1.23.8",
    "pdfplumber==0.10.3",
    "pytesseract==0.3.10",
    "Pillow==10.1.0",
    "reportlab==4.0.7",
    "weasyprint==60.1",
    
    # AI
    "anthropic==0.8.1",
    "google-generativeai==0.3.2",
    "langchain==0.1.0",
    "langchain-anthropic==0.1.1",
    
    # Storage
    "boto3==1.34.19",
    "python-magic==0.4.27",
    
    # Task Queue
    "celery==5.3.4",
    "redis==5.0.1",
    "hiredis==2.3.2",
    
    # Monitoring
    "sentry-sdk[fastapi]==1.39.2",
    "python-json-logger==2.0.7",
    
    # Rate Limiting
    "slowapi==0.1.9",
    
    # Utilities
    "python-dateutil==2.8.2",
    "phonenumbers==8.13.27",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx==0.25.2",
    "faker==20.1.0",
    
    # Code Quality
    "black==23.12.1",
    "ruff==0.1.9",
    "mypy==1.7.1",
    "pre-commit==3.6.0",
    
    # Types
    "types-python-dateutil==2.8.19",
    "types-redis==4.6.0",
]

[tool.setuptools]
packages = ["app"]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "fitz.*",
    "pdfplumber.*",
    "pytesseract.*",
    "reportlab.*",
    "weasyprint.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/alembic/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
